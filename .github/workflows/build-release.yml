name: 构建发布

# 代码改动自动编译并更新 Release（README 等文档改动不触发）
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '**.md'
      - '.gitignore'
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译发布
        shell: pwsh
        run: ./build.ps1

      - name: 打包
        shell: pwsh
        run: Compress-Archive -Path dist/AyuTranslate.exe -DestinationPath AyuTranslate-win-x64.zip

      - name: 生成中文更新说明
        shell: pwsh
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $before = $env:BEFORE
          $hasBefore = $before -and
                       $before -ne '0000000000000000000000000000000000000000' -and
                       (git cat-file -e "$before" 2>$null)
          if ($hasBefore) {
            $commits = @(git log --pretty=format:'- %s' "$before..$env:SHA")
          } else {
            $commits = @(git log --pretty=format:'- %s' -10)
          }
          if ($commits.Count -eq 0) { $commits = @('- 无提交说明') }

          $lines = @(
            "自动构建 #$($env:RUN_NUMBER) · $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC",
            '',
            '### 本次更新内容',
            ''
          ) + $commits + @(
            '',
            '---',
            '',
            '下载解压后运行 AyuTranslate.exe。首次使用请阅读 README 的「快速开始」。',
            '依赖 .NET 8 桌面运行时（未安装请到 https://dotnet.microsoft.com/download/dotnet/8.0 下载 Desktop Runtime）。'
          )
          $lines -join "`r`n" | Out-File -FilePath release-notes.md -Encoding utf8

      - name: 更新 Release（latest）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 滚动更新同一个 latest Release：先删旧的（连同 tag），再建新的
          gh release delete latest --yes --cleanup-tag 2>$null
          git push origin ":refs/tags/latest" 2>$null
          gh release create latest AyuTranslate-win-x64.zip `
            --title "最新构建 #$env:GITHUB_RUN_NUMBER（自动发布）" `
            --notes-file release-notes.md
